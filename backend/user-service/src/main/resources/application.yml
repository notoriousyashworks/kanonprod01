server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${PGHOST:postgres}:${PGPORT:5432}/${PGDATABASE:kicksaura}
    username: ${PGUSER:${POSTGRES_USER}}
    password: ${PGPASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: prod
    show-sql: false
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET}
  expiration: 1296000000 # 15 days in milliseconds

app:
  security:
    cookie:
      secure: ${COOKIE_SECURE:false}

msg91:
  widget-id: ${MSG91_WIDGET_ID}
  widget-token: ${MSG91_WIDGET_TOKEN}
  authkey: ${MSG91_AUTHKEY}
