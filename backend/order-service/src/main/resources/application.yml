server:
  port: ${PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${PGHOST:postgres}:${PGPORT:5432}/${PGDATABASE:kicksaura}
    username: ${PGUSER:${POSTGRES_USER}}
    password: ${PGPASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: prod
    show-sql: false

  # ── Gmail SMTP ──────────────────────────────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

# ── Notification config ──────────────────────────────────────────────────────
notification:
  email:
    recipient: kicksauraa@gmail.com
    sender-name: KicksAura Orders

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ── Inter-service URLs ───────────────────────────────────────────────────────
# Set PRODUCT_SERVICE_URL and USER_SERVICE_URL in Railway env vars.
# Falls back to Docker Compose service hostnames for local development.
product-service:
  url: ${PRODUCT_SERVICE_URL:http://product-service:8082}

user-service:
  url: ${USER_SERVICE_URL:http://user-service:8081}
