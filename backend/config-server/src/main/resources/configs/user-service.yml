server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/kicksaura
    username: kicksaura
    password: kicksaura
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: prod
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    hostname: localhost

jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration: 1296000000 # 15 days in milliseconds

msg91:
  widget-id: ${MSG91_WIDGET_ID:36677868776e353439383633}
  widget-token: ${MSG91_WIDGET_TOKEN:}
  authkey: ${MSG91_AUTHKEY:}
