# Kicks Aura storefront (container nginx).
# The VPS host nginx terminates TLS and proxies kicksaura.in -> this container,
# forwarding the original Host header. This file owns URL normalisation,
# status codes, caching and indexing headers.
#
# Public HTML documents (/, /products, /product-details) and the sitemaps are
# rendered by the SSR process in this container (frontend/ssr, 127.0.0.1:3000).
# If it is down or slow, nginx serves the static page instead (@static).
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. This container only sees plain HTTP from
    # the host proxy, so absolute redirects used to downgrade to http://.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml image/svg+xml text/plain;

    # ── Canonical host ─────────────────────────────────────────────
    if ($host = www.kicksaura.in) {
        return 301 https://kicksaura.in$request_uri;
    }

    # ── URL normalisation (single hop, query string preserved) ─────
    # Matched on the ORIGINAL $request_uri so internal redirects (index,
    # try_files, error_page) can never loop. The first path character is
    # restricted so "//host" or "/\host" can't become an open redirect.
    if ($request_uri ~ "^/index(?:\.html)?(?:\?|$)") {
        return 301 /$is_args$args;
    }
    if ($request_uri ~ "^/(?!google5feebd35865e4497\.html)([A-Za-z0-9_-][^?]*)\.html(?:\?|$)") {
        return 301 /$1$is_args$args;
    }
    if ($request_uri ~ "^/([A-Za-z0-9_-][^?]*)/(?:\?|$)") {
        return 301 /$1$is_args$args;
    }

    # ── Errors ──────────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /404 {
        return 404;
    }

    # "View Cart" used to point at a page that never existed.
    location = /cart {
        return 302 /checkout;
    }

    # ── Server-rendered documents ───────────────────────────────────
    location ~ ^/(?:products|product-details)?$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 5s;
        # The renderer's own 404/503 responses pass through unchanged; only
        # nginx-generated errors (renderer down or too slow) fall back.
        proxy_intercept_errors off;
        error_page 502 504 = @static;
    }

    location @static {
        add_header X-SSR "fallback" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri.html /index.html;
    }

    location ~ ^/sitemap(?:s/[a-z0-9-]+)?\.xml$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 30s;
        # No static fallback: a 502 makes crawlers retry instead of caching HTML.
    }

    # ── Private pages: reachable, never indexed ─────────────────────
    location ~ ^/(?:checkout|orders|profile)$ {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri.html =404;
    }

    # ── Static assets ───────────────────────────────────────────────
    # Vite fingerprints everything under /assets/, so it can be cached forever.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /images/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
    location ^~ /logos/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Static assets from public/ folder are copied to root by Vite, no alias needed!
    # Except for the mounted HeroBannerMain.png
    location = /images/HeroBannerMain.png {
        alias /images-override/HeroBannerMain.png;
    }

    # ── API (unchanged proxy; JSON responses are never indexed) ─────
    location ^~ /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex" always;
    }

    # ── Everything else: info/policy pages, robots.txt, verification ─
    # Unknown URLs now return a real 404 instead of the homepage.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html =404;
    }
}
