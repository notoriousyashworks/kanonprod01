server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    location / {
        index index.html index.htm;
        try_files $uri $uri.html $uri/ /index.html;

        if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
            return 301 /$1$2;
        }
    }

    # Static assets from public/ folder (needed when volume-mounting raw source)
    location /logos/ {
        alias /usr/share/nginx/html/public/logos/;
        try_files $uri =404;
    }

    location = /images/HeroBannerMain.png {
        alias /images-override/HeroBannerMain.png;
    }

    location /images/ {
        alias /usr/share/nginx/html/public/images/;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
