<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — KicksAura</title>
  <meta name="description" content="Manage your KicksAura account profile and saved address." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/global.css?v=1.3" />
  <style>
    body { background: #f7f7f8; font-family: 'Inter', sans-serif; }

    .profile-page-wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    .profile-page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .profile-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      text-decoration: none;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 7px 14px;
      transition: all 0.15s;
    }
    .profile-back-btn:hover { background: #f0f4ff; color: #2563eb; border-color: #2563eb; }

    .profile-page-title {
      font-size: 24px;
      font-weight: 800;
      color: #111;
      margin: 0;
    }

    /* Avatar section */
    .profile-avatar-section {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      border: 1px solid #f0f0f0;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
    }
    .profile-avatar-circle {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .profile-avatar-info h2 {
      font-size: 20px;
      font-weight: 800;
      color: #111;
      margin: 0 0 4px;
    }
    .profile-avatar-info p {
      font-size: 13px;
      color: #888;
      margin: 0;
    }

    /* Section cards */
    .profile-section {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      border: 1px solid #f0f0f0;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .profile-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid #f5f5f5;
    }

    .profile-section-title {
      font-size: 14px;
      font-weight: 700;
      color: #111;
      margin: 0;
    }

    .profile-edit-btn {
      font-size: 13px;
      font-weight: 600;
      color: #2563eb;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .profile-edit-btn:hover { background: #eff6ff; }

    /* Contact row */
    .profile-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
    }
    .profile-info-label {
      font-size: 13px;
      color: #888;
      font-weight: 500;
    }
    .profile-info-value {
      font-size: 14px;
      font-weight: 600;
      color: #111;
    }
    .profile-info-value.empty {
      color: #bbb;
      font-weight: 400;
    }

    .profile-divider {
      height: 1px;
      background: #f5f5f5;
      margin: 0 20px;
    }

    /* Edit form */
    .profile-edit-form {
      padding: 16px 20px 20px;
      display: none;
    }
    .profile-edit-form.visible { display: block; }

    .pf-field {
      margin-bottom: 14px;
    }
    .pf-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .pf-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: #111;
      transition: border 0.15s;
      box-sizing: border-box;
    }
    .pf-input:focus { outline: none; border-color: #2563eb; }

    .pf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .pf-save-btn {
      background: #111;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .pf-save-btn:hover { background: #333; }

    /* Empty address */
    .profile-empty-address {
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #aaa;
    }
    .profile-empty-address p { margin: 0; font-size: 14px; }

    /* Sign out */
    .profile-signout-section {
      margin-top: 8px;
    }
    .profile-signout-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #dc2626;
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .profile-signout-btn:hover { background: #fef2f2; border-color: #dc2626; }

    /* Custom Logout Modal */
    .logout-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .logout-modal-overlay.active {
      display: flex;
      opacity: 1;
    }
    .logout-modal {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      transform: translateY(20px);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .logout-modal-overlay.active .logout-modal {
      transform: translateY(0);
    }
    .logout-modal-icon {
      width: 48px;
      height: 48px;
      background: #fef2f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: #dc2626;
    }
    .logout-modal h3 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
      color: #111;
    }
    .logout-modal p {
      margin: 0 0 24px;
      font-size: 14px;
      color: #666;
      line-height: 1.4;
    }
    .logout-modal-actions {
      display: flex;
      gap: 12px;
    }
    .logout-modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .logout-modal-cancel {
      background: #f5f5f5;
      color: #444;
    }
    .logout-modal-cancel:hover {
      background: #e5e5e5;
    }
    .logout-modal-confirm {
      background: #dc2626;
      color: #fff;
    }
    .logout-modal-confirm:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>
  <!-- Global Preloader -->
  <div id="global-ka-preloader" style="position: fixed; inset: 0; background: var(--bg-main, #f5f5f5); z-index: 999999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease, visibility 0.5s ease;">
    <div class="ka-loader" style="min-height: 100vh; margin: 0;">
      <div class="ka-loader__badge">
        <div class="ka-loader__wordmark">KICKS<br>AURA</div>
      </div>
      <span class="ka-loader__text" style="font-size: 14px;">Loading...</span>
    </div>
  </div>
  <script>
    (function() {
      const startTime = Date.now();
      const minDelay = 0;
      function hideLoader() {
        const preloader = document.getElementById("global-ka-preloader");
        if (!preloader) return;
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, minDelay - elapsed);
        setTimeout(() => {
          preloader.style.opacity = "0";
          preloader.style.visibility = "hidden";
          setTimeout(() => preloader.remove(), 500);
        }, remaining);
      }
      if (document.readyState === "complete") {
        hideLoader();
      } else {
        window.addEventListener("load", hideLoader);
      }
    })();
  </script>
  <div id="navbar-container"></div>

  <div class="profile-page-wrap">
    <div class="profile-page-header">
      <a href="/" class="profile-back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <h1 class="profile-page-title">Profile</h1>
    </div>

    <!-- Avatar / Name -->
    <div class="profile-avatar-section">
      <div class="profile-avatar-circle" id="profile-avatar-initials">👤</div>
      <div class="profile-avatar-info">
        <h2 id="profile-full-name">Guest</h2>
        <p id="profile-phone-display">No phone number saved</p>
      </div>
    </div>

    <!-- Contact Section -->
    <div class="profile-section">
      <div class="profile-section-header">
        <h3 class="profile-section-title">Contact</h3>
        <button class="profile-edit-btn" id="edit-contact-btn">Edit</button>
      </div>

      <div id="contact-view">
        <div class="profile-info-row">
          <span class="profile-info-label">Phone</span>
          <span class="profile-info-value" id="view-phone">—</span>
        </div>
        <div class="profile-divider"></div>
        <div class="profile-info-row">
          <span class="profile-info-label">Name</span>
          <span class="profile-info-value" id="view-name">—</span>
        </div>
      </div>

      <div class="profile-edit-form" id="contact-edit-form">
        <div class="pf-row">
          <div class="pf-field">
            <label class="pf-label" for="pf-first-name">First Name</label>
            <input type="text" class="pf-input" id="pf-first-name" placeholder="First name" />
          </div>
          <div class="pf-field">
            <label class="pf-label" for="pf-last-name">Last Name</label>
            <input type="text" class="pf-input" id="pf-last-name" placeholder="Last name" />
          </div>
        </div>
        <div class="pf-field">
          <label class="pf-label" for="pf-phone">Phone Number</label>
          <input type="tel" class="pf-input" id="pf-phone" placeholder="10-digit phone number" maxlength="10" readonly style="background-color: var(--color-bg-secondary); cursor: not-allowed; color: var(--color-text-secondary);" />
        </div>
        <button class="pf-save-btn" id="save-contact-btn">Save Changes</button>
      </div>
    </div>

    <!-- Address Section -->
    <div class="profile-section">
      <div class="profile-section-header">
        <h3 class="profile-section-title">Saved Addresses</h3>
        <button class="profile-edit-btn" id="add-address-btn">+ Add New</button>
      </div>

      <div id="address-list-view">
        <div class="profile-empty-address" id="address-empty">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <p>No addresses saved yet</p>
        </div>
        <!-- Addresses will be injected here -->
      </div>

      <div class="profile-edit-form" id="address-edit-form">
        <input type="hidden" id="pf-address-index" value="-1" />
        <div class="pf-field">
          <label class="pf-label" for="pf-address">House / Address</label>
          <input type="text" class="pf-input" id="pf-address" placeholder="House No., Apartment, Hostel or Street Address" />
        </div>
        <div class="pf-field">
          <label class="pf-label" for="pf-landmark">Landmark (optional)</label>
          <input type="text" class="pf-input" id="pf-landmark" placeholder="Landmark" />
        </div>
        <div class="pf-row">
          <div class="pf-field">
            <label class="pf-label" for="pf-city">City</label>
            <input type="text" class="pf-input" id="pf-city" placeholder="City" />
          </div>
          <div class="pf-field">
            <label class="pf-label" for="pf-state">State</label>
            <select class="pf-input" id="pf-state" style="color: #000; appearance: auto;">
              <option value="" disabled selected hidden>Select a State...</option>
              <option value="Andhra Pradesh">Andhra Pradesh</option>
              <option value="Arunachal Pradesh">Arunachal Pradesh</option>
              <option value="Assam">Assam</option>
              <option value="Bihar">Bihar</option>
              <option value="Chandigarh">Chandigarh</option>
              <option value="Chhattisgarh">Chhattisgarh</option>
              <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli</option>
              <option value="Delhi">Delhi</option>
              <option value="Goa">Goa</option>
              <option value="Gujarat">Gujarat</option>
              <option value="Haryana">Haryana</option>
              <option value="Himachal Pradesh">Himachal Pradesh</option>
              <option value="Jammu and Kashmir">Jammu and Kashmir</option>
              <option value="Jharkhand">Jharkhand</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Kerala">Kerala</option>
              <option value="Ladakh">Ladakh</option>
              <option value="Lakshadweep">Lakshadweep</option>
              <option value="Madhya Pradesh">Madhya Pradesh</option>
              <option value="Maharashtra">Maharashtra</option>
              <option value="Manipur">Manipur</option>
              <option value="Meghalaya">Meghalaya</option>
              <option value="Mizoram">Mizoram</option>
              <option value="Nagaland">Nagaland</option>
              <option value="Odisha">Odisha</option>
              <option value="Puducherry">Puducherry</option>
              <option value="Punjab">Punjab</option>
              <option value="Rajasthan">Rajasthan</option>
              <option value="Sikkim">Sikkim</option>
              <option value="Tamil Nadu">Tamil Nadu</option>
              <option value="Telangana">Telangana</option>
              <option value="Tripura">Tripura</option>
              <option value="Uttar Pradesh">Uttar Pradesh</option>
              <option value="Uttarakhand">Uttarakhand</option>
              <option value="West Bengal">West Bengal</option>
            </select>
          </div>
        </div>
        <div class="pf-field" style="position: relative;">
          <label class="pf-label" for="pf-pin">PIN Code</label>
          <input type="text" class="pf-input" id="pf-pin" placeholder="6-digit PIN" maxlength="6" autocomplete="postal-code" inputmode="numeric" />
          <div class="pin-spinner" id="pf-pin-spinner" aria-hidden="true" style="right: 12px; top: 38px;"></div>
        </div>
        <button class="pf-save-btn" id="save-address-btn">Save Address</button>
        <button class="pf-save-btn" id="cancel-address-btn" style="background: var(--color-bg-secondary); color: var(--color-text-main); margin-top: 8px;">Cancel</button>
      </div>
    </div>

    <!-- Sign Out -->
    <div class="profile-signout-section">
      <button class="profile-signout-btn" id="signout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </button>
    </div>
  </div>

  <!-- Custom Logout Modal HTML -->
  <div class="logout-modal-overlay" id="logout-modal">
    <div class="logout-modal">
      <div class="logout-modal-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <h3>Sign Out</h3>
      <p>Are you sure you want to sign out?</p>
      <div class="logout-modal-actions">
        <button class="logout-modal-btn logout-modal-cancel" id="logout-cancel">Cancel</button>
        <button class="logout-modal-btn logout-modal-confirm" id="logout-confirm">Sign Out</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/js/profile-page.js"></script>
</body>
</html>
