<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Kicks Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      background: #fff;
      color: #1a1c1c;
      font-family: Inter, sans-serif;
    }

    main {
      box-sizing: border-box;
      width: min(100%, 48rem);
      padding: clamp(48px, 9vw, 80px) 24px;
      border-radius: 24px;
      background: #f9f9f9;
      text-align: center;
    }

    h1 {
      margin: 0;
      font: 800 clamp(28px, 6vw, 48px)/1.1 Montserrat, sans-serif;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    p {
      margin: 24px 0;
      font-size: 18px;
      line-height: 28px;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding-inline: 24px;
      border-radius: 8px;
      background: #b7102a;
      color: #fff;
      font: 700 16px/24px Montserrat, sans-serif;
      text-decoration: none;
    }

    a:hover {
      background: #92001c;
    }

    a:focus-visible {
      outline: 2px solid #1a1c1c;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Kicks Aura</h1>
    <p>For sneaker and accessory shopping, call us at</p>
    <a href="tel:+916239379751">6239379751</a>
  </main>
</body>
</html>
