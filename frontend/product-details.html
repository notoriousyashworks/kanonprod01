<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details — KicksAura</title>
  <meta name="description" content="View product details, select your size, and add to cart on KicksAura." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/global.css?v=3.9" />
  <link rel="stylesheet" href="/src/styles/product-card.css?v=1.2" />
  <link rel="stylesheet" href="/src/styles/product-details.css?v=1.4" />
</head>
<body>
  <!-- Global Preloader -->
  <div id="global-ka-preloader" style="position: fixed; inset: 0; background: var(--bg-main, #f5f5f5); z-index: 999999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease, visibility 0.5s ease;">
    <div class="ka-loader" style="min-height: 100vh; margin: 0;">
      <div class="ka-loader__badge">
        <div class="ka-loader__wordmark">KICKS<br>AURA</div>
      </div>
      <span class="ka-loader__text" style="font-size: 14px;">Loading...</span>
    </div>
  </div>
  <script>
    (function() {
      const startTime = Date.now();
      const minDelay = 0;
      function hideLoader() {
        const preloader = document.getElementById("global-ka-preloader");
        if (!preloader) return;
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, minDelay - elapsed);
        setTimeout(() => {
          preloader.style.opacity = "0";
          preloader.style.visibility = "hidden";
          setTimeout(() => preloader.remove(), 500);
        }, remaining);
      }
      if (document.readyState === "complete") {
        hideLoader();
      } else {
        window.addEventListener("load", hideLoader);
      }
    })();
  </script>
  <div id="navbar-container"></div>
  
  <main class="product-page">
    <div class="product-container" id="product-container">
      <!-- Loading state -->
      <div id="product-loading" style="grid-column: 1/-1;">
        <div class="ka-loader">
          <div class="ka-loader__badge">
            <div class="ka-loader__wordmark">KICKS<br>AURA</div>
          </div>
          <span class="ka-loader__text">Loading product…</span>
        </div>
      </div>
    </div>
  </main>
  
  <div id="footer-container"></div>
  
  <script type="module" src="/src/js/product-details.js?v=1.6"></script>
</body>
</html>
