services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?err}
      POSTGRES_DB: ${POSTGRES_DB?err}
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      kicksaura-net:
        aliases:
          - kicksaura
          - postgres
          - kicksaura-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kicksaura -d kicksaura"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped



  user-service:
    build: ./backend/user-service
    container_name: kicksaura-user-service
    hostname: user-service
    ports:
      - "8081:8081"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?err}
      POSTGRES_DB: ${POSTGRES_DB?err}

      MSG91_WIDGET_ID: ${MSG91_WIDGET_ID?err}
      MSG91_WIDGET_TOKEN: ${MSG91_WIDGET_TOKEN?err}
      MSG91_AUTHKEY: ${MSG91_AUTHKEY?err}
      JWT_SECRET: ${JWT_SECRET?err}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kicksaura-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081' || wget -q --spider http://localhost:8081 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 600s
    restart: unless-stopped

  product-service:
    build: ./backend/product-service
    container_name: kicksaura-product-service
    hostname: product-service
    ports:
      - "8082:8082"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?err}
      POSTGRES_DB: ${POSTGRES_DB?err}

      CLOUDINARY_CLOUD_NAME_ADMIN: ${VITE_CLOUDINARY_CLOUD_NAME_ADMIN?err}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY?err}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY?err}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT?err}
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kicksaura-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082' || wget -q --spider http://localhost:8082 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 600s
    restart: unless-stopped

  order-service:
    build: ./backend/order-service
    container_name: kicksaura-order-service
    hostname: order-service
    ports:
      - "8083:8083"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?err}
      POSTGRES_DB: ${POSTGRES_DB?err}

      SMTP_USERNAME: ${SMTP_USERNAME?err}
      SMTP_PASSWORD: ${SMTP_PASSWORD?err}
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kicksaura-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8083' || wget -q --spider http://localhost:8083 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 600s
    restart: unless-stopped



  api-gateway:
    build: ./backend/api-gateway
    container_name: kicksaura-api-gateway
    hostname: api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET?err}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS?err}
      TZ: Asia/Kolkata
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - kicksaura-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || wget -q --spider http://localhost:8080 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 600s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER}
        VITE_CLOUDINARY_CLOUD_NAME_FRONTEND: ${VITE_CLOUDINARY_CLOUD_NAME_FRONTEND}
    container_name: kicksaura-frontend
    hostname: frontend
    ports:
      - "5173:80"
    volumes:
      - ./HeroBannerMain.png:/images-override/HeroBannerMain.png:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - kicksaura-net
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CLOUDINARY_CLOUD_NAME_ADMIN: ${VITE_CLOUDINARY_CLOUD_NAME_ADMIN}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET}
        VITE_IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY}
        VITE_IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
    container_name: kicksaura-admin
    hostname: admin
    ports:
      - "5174:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - kicksaura-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  kicksaura-net:
    name: kicksaura
